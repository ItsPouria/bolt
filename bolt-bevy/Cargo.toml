[package]
name = "bolt-bevy"
version = "0.2.0"
edition = "2024"
description = "A comprehensive Jolt Physics integration for the Bevy game engine."
license = "MIT OR Apache-2.0"
repository = "https://github.com/itspouria/bolt" 
keywords = ["bevy", "physics", "jolt", "gamedev"]
