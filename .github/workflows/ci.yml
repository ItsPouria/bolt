name: CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

# Cancel superseded runs on the same branch/PR instead of queueing them.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege by default; only the test job widens this (to publish the
# JUnit report as a PR check via action-junit-report).
permissions:
  contents: read

jobs:
  # Fast, dependency-free feedback first: no APT packages, no Rust cache.
  fmt:
    name: Formatting
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Check Formatting
        run: cargo fmt --all -- --check

  dep-guard:
    name: Dependency Guards
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      # Both guards fail closed: if `cargo tree` itself errors (git fetch,
      # manifest, or lockfile skew), the command-substitution assignment aborts
      # the step under `set -e` instead of the guard silently passing.
      # Edges are limited to normal,build,dev — NOT `all`: `all` includes
      # feature edges, which render as `name feature "x"` lines with no
      # version and would slip past the version-anchored pattern. The
      # `── ` prefix anchors matches to dependency entries (including
      # bevy_*/rolt-* subcrates), so crate names merely containing them as
      # substrings can't false-positive.
      - name: Forbid direct rolt/joltc-sys dependency in bolt-bevy
        run: |
          set -euo pipefail
          tree=$(cargo tree -p bolt-bevy --edges normal,build,dev --depth 1 --locked)
          if grep -E '── (rolt|joltc-sys)[^ ]* v[0-9]' <<< "$tree"; then
            echo "::error::bolt-bevy must not depend directly on rolt/joltc-sys (any edge kind)"
            exit 1
          fi
      - name: Forbid any bevy dependency in bolt-core
        run: |
          set -euo pipefail
          tree=$(cargo tree -p bolt-core --edges normal,build,dev --depth 1 --locked)
          if grep -E '── bevy[^ ]* v[0-9]' <<< "$tree"; then
            echo "::error::bolt-core must have zero Bevy dependencies (normal, dev, or build)"
            exit 1
          fi

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install APT dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libx11-dev libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev
      - name: Setup Rust Cache
        uses: Swatinem/rust-cache@v2
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

  docs:
    name: Docs
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install APT dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libx11-dev libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev
      - name: Setup Rust Cache
        uses: Swatinem/rust-cache@v2
      - name: Docs (broken intra-doc links fail)
        run: RUSTDOCFLAGS="-D warnings" cargo doc --workspace --no-deps --locked

  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      # Publish JUnit results as a PR check (action-junit-report).
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v4
      - name: Install APT dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libx11-dev libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev
      - name: Setup Rust Cache
        uses: Swatinem/rust-cache@v2
      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - name: Run tests
        run: cargo nextest run --workspace --all-targets --profile ci --locked
      - name: Upload test results (JUnit)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-junit
          path: target/nextest/ci/results.junit.xml
          if-no-files-found: error
      - name: Publish test report
        if: always()
        uses: mikepenz/action-junit-report@v4
        with:
          report_paths: target/nextest/ci/results.junit.xml
          check_name: Test Report
          detailed_summary: true

  # bolt-core wraps a C++ runtime; the bug class the normal test job cannot
  # see is heap corruption on the other side of the FFI boundary (the #3
  # double-destroy story). This job runs bolt-core's suite under
  # AddressSanitizer with BOTH sides instrumented: RUSTFLAGS covers Rust,
  # and CFLAGS/CXXFLAGS flow into Jolt's CMake build (joltc-sys uses the
  # cmake crate, which initializes CMAKE_*_FLAGS from those env vars), so
  # libJolt.a itself is compiled with -fsanitize=address and shares rustc's
  # ASan runtime at link time. LeakSanitizer comes along free on Linux
  # (on by default with ASan): clean exits double as leak checks for the
  # teardown tests. Verified locally end-to-end: -fsanitize=address present
  # in CMake's generated flags.make for both Jolt and JoltC, ~2.9k __asan
  # symbols in libJolt.a, runtime confirmed active via ASAN_OPTIONS=verbosity=1.
  #
  # Two deliberate quirks:
  # - Nightly-only: -Zsanitizer is an unstable flag. Nothing else in this
  #   repo moves to nightly — this job is a visitor, not a migration.
  # - --target names the HOST triple on purpose: with an explicit target,
  #   cargo applies RUSTFLAGS only to target artifacts, leaving host
  #   artifacts (proc-macros and build scripts: bindgen, paste) clean —
  #   rustc refuses to build sanitizer-instrumented proc-macros.
  asan:
    name: ASan (bolt-core FFI)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install nightly toolchain
        uses: dtolnay/rust-toolchain@nightly
      - name: Setup Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          # Separate cache slot: nightly + sanitizer RUSTFLAGS fingerprints
          # must not mix with the stable jobs' cached artifacts.
          key: asan
      - name: Test under AddressSanitizer
        env:
          CFLAGS: "-fsanitize=address -fno-omit-frame-pointer"
          CXXFLAGS: "-fsanitize=address -fno-omit-frame-pointer"
          RUSTFLAGS: "-Zsanitizer=address"
        run: cargo +nightly test -p bolt-core --locked --target x86_64-unknown-linux-gnu
